[project]
name = "urjaa-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy",
    "psycopg2-binary",
    "alembic",
    "pydantic>=2.0",
    "python-dotenv",
    "bcrypt",
    "cloudinary",
    "razorpay",
    "resend",
    "google-auth",
    "twilio>=9.0.0",
    "APScheduler>=3.10.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["urjaa_core*"]
